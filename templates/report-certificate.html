<style>
  @font-face { font-family: "Inter";         src: url("fonts/Inter-Regular.otf");          font-weight: 400; }

  html, body { margin: 0; padding: 0; background: #dcdee3; }
  body {
    font-family: var(--sans); color: var(--ink);

  .page {
    width: 210mm; height: 297mm; margin: 0 auto; background: #fff;
    padding: 15mm 16mm 12mm;
    display: flex; flex-direction: column; overflow: hidden; position: relative;
    break-after: page; page-break-after: always;
  }
  .page:last-of-type { break-after: auto; page-break-after: auto; }
  @media screen { .page { margin: 8mm auto; box-shadow: 0 6px 34px rgba(20,24,40,.16); } }
  @media print  { html, body { background: #fff; } .page { margin: 0; box-shadow: none; } }

  /* header & footer */
  .head { display: flex; justify-content: space-between; align-items: flex-start; }
  .brand { display: flex; align-items: center; gap: 3.4mm; }
  .mark {
    width: 9.5mm; height: 9.5mm; border-radius: 1.8mm; background: var(--brand); color: #fff;

  .brand .tag { font-size: 7.6pt; color: var(--muted); margin-top: .8mm; }

  .foot { margin-top: auto; padding-top: 3mm; border-top: .25mm solid var(--hair); font-size: 6.9pt; line-height: 1.45; color: var(--muted); display: flex; justify-content: space-between; gap: 10mm; }
  .foot span:last-child { white-space: nowrap; }

  /* page 1 */
  .who { margin-top: 13mm; }
  .who-row { display: flex; justify-content: space-between; align-items: baseline; gap: 6mm; }
  .who .lead { font-size: 9.4pt; color: var(--muted); }
  .who .status-pill {
    font-size: 7.5pt; font-weight: 600; padding: 1.2mm 2.8mm;

  .who .name {

  .verdict .pts { font-size: 9.4pt; color: var(--muted); margin-top: 1.4mm; }

  /* page 2 */

  .areas { margin-top: 8mm; display: grid; grid-template-columns: 1fr 1fr; column-gap: 11mm; row-gap: 0; }
  .area { border-top: .3mm solid var(--ink); padding-top: 3mm; margin-bottom: 6.5mm; display: grid; grid-row: span 3; grid-template-rows: subgrid; row-gap: 0; }
  .area .an { font-size: 11pt; font-weight: 600; }
  .area .grp { margin-top: 3mm; }
  .area .gl { font-size: 8pt; font-weight: 600; display: flex; align-items: center; gap: 1.8mm; }
  .area .gl::before { content: ""; width: 1.7mm; height: 1.7mm; background: var(--accent); flex: none; }
  .area .grp.cons .gl::before { background: none; border: .3mm solid var(--muted); }
  .area ul { list-style: none; margin: 1.6mm 0 0; padding: 0; }
  .area li { font-size: 7.9pt; line-height: 1.45; color: var(--body); padding-left: 3.6mm; position: relative; margin-bottom: 1.2mm; }
  .area li::before { content: ""; position: absolute; left: 0; top: 2.2mm; width: 1.8mm; height: .25mm; background: var(--muted); }

  .overall { margin-top: 2mm; border-top: .3mm solid var(--ink); padding-top: 3.4mm; display: grid; grid-template-columns: 1fr 1fr; column-gap: 11mm; }
  .overall .ot { font-size: 11pt; font-weight: 600; }
  .overall .tx { font-size: 8.1pt; line-height: 1.5; color: var(--body); margin: 2.4mm 0 0; }
  .overall .ml { font-size: 8.1pt; font-weight: 600; margin-top: 4.4mm; display: flex; align-items: center; gap: 1.8mm; }
  .overall .ml::before { content: ""; width: 1.7mm; height: 1.7mm; background: var(--good); flex: none; }
  .overall .mtx { font-size: 7.9pt; line-height: 1.48; color: var(--body); margin: 1.6mm 0 0; }
  .overall .fl { font-size: 8.1pt; font-weight: 600; display: flex; align-items: center; gap: 1.8mm; }
  .overall .fl::before { content: ""; width: 1.7mm; height: 1.7mm; background: var(--accent); flex: none; }
  .overall .focus { font-family: var(--serif); font-size: 13.2pt; line-height: 1.3; letter-spacing: -.008em; margin: 2.2mm 0 0; }
  .overall .al { font-size: 8.1pt; font-weight: 600; margin-top: 4.6mm; }
  .overall .adv { font-size: 7.9pt; line-height: 1.48; color: var(--body); margin: 1.6mm 0 0; }

  /* page 3: daily lesson & anki recall (v8 editorial layout) */
  .lesson-wrap { margin-top: 7mm; border-top: .3mm solid var(--ink); padding-top: 3.6mm; }
  .sec-head { display: flex; flex-direction: column; gap: 1mm; }
  .sec-head h3 { font-size: 11pt; font-weight: 600; margin: 0; color: var(--ink); }
  .sec-head span { font-size: 8pt; color: var(--muted); line-height: 1.4; }

  .vswitch-grid { margin-top: 5mm; display: grid; grid-template-columns: 1fr 1fr; column-gap: 11mm; }
  .vswitch-col h4 { font-size: 8.6pt; font-weight: 600; margin: 0 0 2.4mm; color: var(--ink); }
  .vswitch-row { display: flex; align-items: flex-start; gap: 2.2mm; margin-bottom: 1.8mm; }
  .vswitch-row i { display: inline-block; width: 1.65mm; height: 1.65mm; flex: none; margin-top: 1.45mm; }
  .vswitch-row.wrong i { border: .3mm solid var(--muted); background: none; }
  .vswitch-row.wrong span { font-size: 8.3pt; line-height: 1.4; color: var(--muted); text-decoration: line-through; }
  .vswitch-row.right i { background: var(--accent); margin-top: 2.0mm; }
  .vswitch-row.right span { font-family: var(--serif); font-size: 11.2pt; line-height: 1.32; color: var(--ink); }

  .anchor-band {
    margin-top: 4.5mm; padding: 4.4mm 5.2mm;
    background: color-mix(in srgb, var(--accent) 8%, #ffffff);
    display: grid; grid-template-columns: 1.3fr 1fr; column-gap: 8mm; align-items: center;
  }
  .anchor-main { font-family: var(--serif); font-size: 12pt; line-height: 1.3; color: var(--ink); }
  .anchor-sub  { font-size: 7.7pt; line-height: 1.48; color: var(--muted); }

  .g-lessons { margin-top: 5.5mm; display: grid; grid-template-columns: 1fr 1fr; column-gap: 11mm; }
  .g-card { padding-top: .4mm; }
  .g-wrong { font-size: 8.2pt; line-height: 1.38; color: var(--muted); text-decoration: line-through; }
  .g-time  { font-size: 7.4pt; line-height: 1.35; color: var(--muted); margin-top: .8mm; }

  .anki-wrap { margin-top: 7mm; border-top: .3mm solid var(--ink); padding-top: 3.6mm; }

  .anki-row {
    display: grid; grid-template-columns: 27mm 1fr 56mm; column-gap: 6mm; align-items: start;
    border-top: .25mm solid var(--hair); padding: 3.4mm 0;
  }
  .anki-kind  { font-size: 8.2pt; font-weight: 600; color: var(--ink); line-height: 1.35; }
  .anki-badge { font-size: 7.6pt; color: var(--muted); line-height: 1.4; margin-top: .4mm; }
  .anki-ans   { font-family: var(--serif); font-size: 11.4pt; line-height: 1.25; color: var(--ink); }
  .anki-cue   { font-size: 7.6pt; line-height: 1.4; color: var(--muted); margin-top: 1.1mm; }
  .anki-rule  { font-size: 7.8pt; line-height: 1.45; color: var(--body); }

<script>
(function () {
  const D = JSON.parse(document.getElementById('cert-data').textContent);
  const $ = (id) => document.getElementById(id);
  const NS = 'http://www.w3.org/2000/svg';
  const esc = (t) => String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

  const bandIndex = (s) => {
    const i = D.bands.findIndex(b => s >= b.min && s <= b.max);
    return i < 0 ? (s < 1 ? 0 : D.bands.length - 1) : i;
  };
  const pillars = [
    { key: 'english_fluency', short: 'Fluency', title: 'English fluency' },
    { key: 'communication',   short: 'Comm',    title: 'Communication' },
    { key: 'body_language',   short: 'Body',    title: 'Body language' },
    { key: 'tonality',        short: 'Tonality',title: 'Tonality' }
  ];
  const vals = pillars.map(p => Number(D.scores[p.key]));
  const overall = D.scores.overall != null ? Number(D.scores.overall) : Math.round(vals.reduce((a,b) => a + b, 0) / vals.length);
  const oi = bandIndex(overall);
  const oB = D.bands[oi];
  const tierColor = (cefr) => (D.tiers.find(t => t.key === cefr[0]) || D.tiers[0]).color;
  const oColor = tierColor(oB.cefr);
  document.documentElement.style.setProperty('--accent', oColor);
  document.documentElement.style.setProperty('--brand', D.org.color || '#2a3dd8');

  const headHTML =
    '<div class="brand"><div class="mark">' + esc(D.org.mark) + '</div><div>' +
    '<div class="org">' + esc(D.org.name) + '</div><div class="tag">' + esc(D.org.tagline) + '</div></div></div>' +
    '<div class="meta"><div class="ttl">' + esc(D.certificate.title) + '</div>' +
    '<div>' + esc(D.certificate.awardedLabel + ' ' + D.certificate.date) + '</div>' +
    '<div>' + esc(D.footer.certificateId) + '</div></div>';
  document.querySelectorAll('[data-chrome]').forEach(h => { h.innerHTML = headHTML; });
  const feet = document.querySelectorAll('[data-foot]');
  feet.forEach((f, i) => {
    f.innerHTML = '<span>' + esc(D.footer.note) + '</span><span>Page ' + (i + 1) + ' of ' + feet.length + '</span>';
  });

  $('lead').textContent = D.certificate.certifyLine;
  $('status-pill').textContent = D.certificate.takeStatus || 'Complete Take';
  $('name').textContent = D.certificate.name;
  $('done').textContent = D.certificate.completedLine;
  $('numeral').textContent = oB.cefr;
  $('v-level').textContent = oB.label;
  $('v-points').textContent = overall + ' out of 100 overall';
  $('v-why').textContent = D.summary;
  document.title = D.certificate.title + ' – ' + D.certificate.name;

  /* skyline chart with 4 staggered pillar markers */
  const svg = $('sky');
  const W = 178, BASE = 46, H = 74;
  const heights = [10, 17, 24, 31, 38, 45];
  svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);

  const mk = (tag, attrs, parent, targetSvg) => {
    const n = document.createElementNS(NS, tag);
    for (const k in attrs) n.setAttribute(k, attrs[k]);
    (parent || targetSvg || svg).appendChild(n);
    return n;
  };
  const txt = (content, attrs, targetSvg) => {
    const t = mk('text', attrs, null, targetSvg);
    t.textContent = content;
    return t;
  };
  const x = (s) => (Math.max(0, Math.min(100, s)) / 100) * W;

  D.bands.forEach((b, i) => {
    const start = i === 0 ? 0 : D.bands[i - 1].max;
    const x0 = x(start), x1 = x(b.max), h = heights[i] || heights[heights.length - 1];
    const top = BASE - h;
    const w = x1 - x0 - 0.7;
    const bx = x0 + 0.35;
    const c = tierColor(b.cefr);
    let fill = 'none', stroke = c, code = c, rng = c, so = .4, fo = 1, ro = .8;
    if (i < oi)        { fill = c; stroke = 'none'; code = '#15171c'; rng = '#4a4f5c'; fo = 0.14 + 0.04 * i; ro = 1; }
    else if (i === oi) { fill = c; stroke = 'none'; code = '#ffffff'; rng = '#ffffff'; ro = .88; }
    mk('rect', { x: bx, y: top, width: w, height: h, fill: fill, 'fill-opacity': fo, stroke: stroke, 'stroke-opacity': so, 'stroke-width': .3 });
    txt(b.cefr, { x: bx + 2.4, y: top + 5.2, 'font-size': 3.6, 'font-weight': 600, fill: code });
    txt(b.min + '\u2013' + b.max, { x: bx + 2.4, y: top + 8.8, 'font-size': 2.6, fill: rng, 'fill-opacity': ro });
  });
  mk('line', { x1: 0, y1: BASE, x2: W, y2: BASE, stroke: '#15171c', 'stroke-width': .3 });

  D.tiers.forEach((t, k) => {
    const cs = D.bands.filter(bb => bb.cefr[0] === t.key).map(bb => bb.cefr);
    const ly = 4.5 + k * 5.2;
    mk('rect', { x: 0, y: ly - 2.3, width: 2.3, height: 2.3, fill: t.color });
    const lt = mk('text', { x: 4.2, y: ly - .1, 'font-size': 2.8, fill: '#3a3e48' });
    const strong = mk('tspan', { 'font-weight': 600, fill: '#15171c' }, lt);
    strong.textContent = cs[0] + (cs.length > 1 ? '\u2013' + cs[cs.length - 1] : '') + '  ';
    lt.appendChild(document.createTextNode(t.name));
  });

  const px = x(overall);
  const barTop = BASE - heights[oi];
  mk('line', { x1: px, y1: barTop, x2: px, y2: barTop - 8, stroke: oColor, 'stroke-width': .35 });
  mk('circle', { cx: px, cy: barTop - 8, r: 1.3, fill: oColor });
  const left = oi > 0;
  const lab = mk('text', {
    x: left ? px - 3.2 : px + 3.2, y: barTop - 7.1,
    'text-anchor': left ? 'end' : 'start', 'font-size': 2.9, fill: '#6b707c'
  });
  lab.appendChild(document.createTextNode('Overall '));
  const ls = mk('tspan', { 'font-size': 4.0, 'font-weight': 600, fill: '#15171c' }, lab);
  ls.textContent = overall;

  /* 4 sorted markers below baseline: assign first row (0..3) with >= 26 SVG-unit horizontal clearance */
  const sortedMarkers = pillars
    .map(p => ({ label: p.short, score: Number(D.scores[p.key]) }))
    .sort((a, b) => a.score - b.score);
  const rowLastEnd = [-999, -999, -999, -999];
  const minGap = 28;
  sortedMarkers.forEach((m) => {
    const sx = x(m.score);
    const anchorEnd = sx > W * 0.78;
    const labelStartX = anchorEnd ? sx - 28 : sx;
    let row = rowLastEnd.findIndex(endX => labelStartX - endX >= 3);
    if (row < 0) row = 3;
    rowLastEnd[row] = labelStartX + minGap;

    const stemY = BASE + 4.4 + row * 5.6;
    mk('line', { x1: sx, y1: BASE + 0.5, x2: sx, y2: stemY, stroke: '#15171c', 'stroke-width': .28 });
    mk('circle', { cx: sx, cy: stemY, r: .9, fill: '#15171c' });
    const t = mk('text', {
      x: anchorEnd ? sx - 2.2 : sx + 2.2,
      y: stemY + 1.0,
      'text-anchor': anchorEnd ? 'end' : 'start',
      'font-size': 2.8, fill: '#6b707c'
    });
    t.appendChild(document.createTextNode(m.label + ' '));
    const n = mk('tspan', { 'font-weight': 600, fill: '#15171c', 'font-size': 3.1 }, t);
    n.textContent = m.score;
  });

  /* 4 pillar cards on Page 1 */
  $('skills4').innerHTML = pillars.map(p => {
    const sc = Number(D.scores[p.key]);
    const b = D.bands[bandIndex(sc)];
    const col = tierColor(b.cefr);
    return (
      '<div class="skill"><div class="row"><div class="nm">' + esc(p.title) + '</div>' +
      '<div class="lv"><i style="--c:' + col + '"></i>' + esc(b.cefr + ' ' + b.label) + '</div></div>' +
      '<div class="sc"><span class="n">' + sc + '</span><span class="of">out of 100</span></div>' +
      '<p>' + esc((D.pillarSummaries || {})[p.key] || '') + '</p></div>'
    );
  }).join('');

  /* page 2: review + memory */
  const R = D.review;
  $('r-title').textContent = R.title;
  $('r-sub').textContent = R.subtitle;
  const list = (arr) => '<ul>' + arr.map(t => '<li>' + esc(t) + '</li>').join('') + '</ul>';
  $('r-areas').innerHTML = R.areas.map(a =>
    '<div class="area"><div class="an">' + esc(a.name) + '</div>' +
    '<div class="grp pros"><div class="gl">' + esc(R.labels.pros) + '</div>' + list(a.pros) + '</div>' +
    '<div class="grp cons"><div class="gl">' + esc(R.labels.cons) + '</div>' + list(a.cons) + '</div></div>'
  ).join('');
  const O = R.overall;
  $('r-overall').innerHTML =
    '<div><div class="ot">' + esc(O.title) + '</div><p class="tx">' + esc(O.text) + '</p>' +
    '<div class="ml">' + esc(O.memoryLabel || 'Memory check & compliments') + '</div><p class="mtx">' + esc(O.memoryText || '') + '</p></div>' +
    '<div><div class="fl">' + esc(O.focusLabel) + '</div><p class="focus">' + esc(O.focus) + '</p>' +
    '<div class="al">' + esc(O.adviceLabel) + '</div><p class="adv">' + esc(O.advice) + '</p></div>';

  /* page 3: daily lesson editorial switch + micro-lessons + anki recall list */
  const L = D.lesson;
  const normArrow = (s) => String(s || '').replace(/\s*->\s*/g, ' \u2192 ');
  const fmtHead = (s) => {
    const clean = normArrow(s).replace(/\s{2,}/g, ' ');
    return clean === clean.toUpperCase() && /[A-Z]/.test(clean)
      ? clean.charAt(0) + clean.slice(1).toLowerCase()
      : clean;
  };
  const fmtBadge = (s) => {
    const raw = String(s || '');
    const formatted = raw === raw.toUpperCase() ? raw.charAt(0) + raw.slice(1).toLowerCase() : raw;
    return formatted.replace(/\s*\u00b7\s*/g, ', ');
  };

  $('l-title').textContent = L.title;
  $('l-sub').textContent = L.subtitle;
  $('v-title').textContent = L.visualTitle;
  $('v-cap').textContent = L.visualCaption;

  const VD = L.visualDiagram;
  const cols = [
    { title: fmtHead(VD.leftTitle),  wrong: VD.leftExampleWrong,  right: VD.leftExampleRight },
    { title: fmtHead(VD.rightTitle), wrong: VD.rightExampleWrong, right: VD.rightExampleRight }
  ];
  $('vswitch-grid').innerHTML = cols.map(c =>
    '<div class="vswitch-col"><h4>' + esc(c.title) + '</h4>' +
    '<div class="vswitch-row wrong"><i></i><span>' + esc(c.wrong) + '</span></div>' +
    '<div class="vswitch-row right"><i></i><span>' + esc(c.right) + '</span></div></div>'
  ).join('');

  $('anchor-band').innerHTML =
    '<div class="anchor-main">' + esc(normArrow(VD.bottomLeft)) + '</div>' +
    '<div class="anchor-sub">' + esc(normArrow(VD.bottomRight).replace(/\s*\u00b7\s*/g, '. ')) + '</div>';

  $('g-lessons').innerHTML = (L.grammarLessons || []).map(g => {
    let wrongText = String(g.wrong || '');
    let timeText = g.time ? String(g.time) : '';
    if (!timeText) {
      const tm = wrongText.match(/^(.*?)\s*\(([^)]+)\)\s*$/);
      if (tm) { wrongText = tm[1]; timeText = tm[2]; }
    }
    return (
      '<div class="g-card">' +
      '<div class="g-wrong">' + esc(wrongText) + '</div>' +
      (timeText ? '<div class="g-time">' + esc(timeText) + '</div>' : '') +
      '<div class="g-right">' + esc(g.right) + '</div>' +
      '<div class="g-why">' + esc(g.why) + '</div></div>'
    );
  }).join('');

  const rawATitle = String(L.ankiTitle || 'Anki recall cards due');
  const am = !L.ankiSubtitle ? rawATitle.match(/^(.*?)\s*\(([^)]+)\)\s*$/) : null;
  $('a-title').textContent = am ? am[1] : rawATitle;
  $('a-sub').textContent = L.ankiSubtitle || (am ? (am[2].charAt(0).toUpperCase() + am[2].slice(1) + '. Spaced repetition across sessions.') : 'Spaced repetition across sessions.');

  $('anki-list').innerHTML = (L.ankiCards || []).map(c =>
    '<div class="anki-row">' +
    '<div><div class="anki-kind">' + esc(c.kind) + '</div><div class="anki-badge">' + esc(fmtBadge(c.badge)) + '</div></div>' +
    '<div><div class="anki-ans">' + esc(c.answer) + '</div><div class="anki-cue">' + esc(c.cue) + '</div></div>' +
    '<div class="anki-rule">' + esc(c.rule) + '</div></div>'
  ).join('');

  (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve())
    .then(() => { window.__certReady = true; });
})();
</script>
</body>
</html>
